<main id="m"></main><main id="v" hidden></main><script type="text/x-python" id="pyh">import sys, io, json
from js import prompt as _jsprompt
class _PfStop(Exception): pass
class _PfLoop(Exception): pass
def _pf_run(code, inp):
    out = io.StringIO()
    q = json.loads(inp) if isinstance(inp, str) else None
    def _input(p=''):
        p = str(p)
        out.write(p)
        if q is None:
            txt = out.getvalue()
            v = _jsprompt(txt[-400:] if txt.strip() else 'Invoer:', '')
            if not isinstance(v, str):
                raise _PfStop()
        else:
            if not q:
                raise EOFError('EOF when reading a line')
            v = q.pop(0)
        out.write(v + '\n')
        return v
    n = [0]
    def lt(f, ev, a):
        n[0] += 1
        if n[0] > 2000000:
            raise _PfLoop()
        return lt
    def gt(f, ev, a):
        return lt if f.f_code.co_filename == '<oefening>' else None
    g = {'__name__': '__main__', 'input': _input}
    so, se = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = out
    err = None
    try:
        c = compile(code, '<oefening>', 'exec')
        sys.settrace(gt)
        try:
            exec(c, g)
        finally:
            sys.settrace(None)
    except SyntaxError as e:
        err = {'t': type(e).__name__, 'm': e.msg, 'l': e.lineno}
    except _PfLoop:
        err = {'t': 'Loop', 'm': '', 'l': None}
    except _PfStop:
        err = {'t': 'Stop', 'm': '', 'l': None}
    except SystemExit:
        pass
    except BaseException as e:
        l = None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == '<oefening>':
                l = tb.tb_lineno
            tb = tb.tb_next
        err = {'t': type(e).__name__, 'm': str(e), 'l': l}
    finally:
        sys.stdout, sys.stderr = so, se
    return json.dumps({'o': out.getvalue(), 'e': err})
</script>

 `-`, `*` (maal) en `/` (delen).", "`//` deelt zonder rest (hoeveel keer past het erin?) en `%` geeft de rest. `**` is machtsverheffing.", "`/` geeft altijd een kommagetal. Met `round(getal, 2)` rond je af op 2 cijfers na de komma. En `x += 2` is de korte schrijfwijze van `x = x + 2`."], "z": ["+", "-", "*", "/", "//", "%", "**", "+=", "round", "divmod"], "vb": [{"c": "print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\nprint(2 ** 3)", "o": "3.5\n3\n1\n8"}, {"c": "kassa = 0\nkassa += 2.5\nkassa += 3\nprint(kassa)", "o": "5.5"}], "fl": null, "x": [{"t": "Hoeveel kosten 4 porties van 1.5 euro?", "k": "print(___)", "s": "print(4 * 1.5)", "o": "6.0", "h": "Vermenigvuldigen doe je met *.", "f": "les03_oef1.py", "v": true, "w": "Je rekent een prijs uit. Vermenigvuldigen doe je met *: 2 * 3 geeft 6. Vervang de ___ door de berekening met het aantal en de prijs. Een kommagetal schrijf je met een punt."}, {"t": "Je hebt 17 porties en een bakje bevat er 5. Hoeveel volle bakjes, en hoeveel porties blijven over?", "k": "volle = 17 ___ 5\nrest = 17 ___ 5\nprint(volle, rest)", "s": "volle = 17 // 5\nrest = 17 % 5\nprint(volle, rest)", "o": "3 2", "h": "Eén operator deelt zonder rest, de andere geeft de rest.", "f": "les03_oef2.py", "v": true, "w": "Je deelt zonder kommagetal. // geeft hoeveel keer iets er volledig in past, % geeft wat overblijft: 7 // 2 is 3 en 7 % 2 is 1. Vervang de eerste ___ door het teken voor 'volle keren' en de tweede door het teken voor 'rest'."}, {"t": "De toonbank is een vierkant van 3 meter. Bereken de oppervlakte met een macht.", "k": "print(3 ___ 2)", "s": "print(3 ** 2)", "o": "9", "h": "Machtsverheffing schrijf je met twee sterretjes.", "f": "les03_oef3.py", "v": true, "w": "Een macht is een getal een aantal keer met zichzelf vermenigvuldigd. In Python schrijf je dat met twee sterretjes: 2 ** 3 geeft 8. Vervang de ___ door dat teken."}, {"t": "Verdeel 10 euro over 3 personen, afgerond op 2 cijfers.", "k": "print(___(10 / 3, 2))", "s": "print(round(10 / 3, 2))
