<div id="cta" hidden></div><main id="m"></main><main id="v" hidden></main><script type="text/x-python" id="pyh">import sys, io, json
from js import prompt as _jsprompt
class _PfStop(Exception): pass
class _PfLoop(Exception): pass
def _pf_run(code, inp):
    out = io.StringIO()
    q = json.loads(inp) if isinstance(inp, str) else None
    def _input(p=''):
        p = str(p)
        out.write(p)
        if q is None:
            txt = out.getvalue()
            v = _jsprompt(txt[-400:] if txt.strip() else 'Invoer:', '')
            if not isinstance(v, str):
                raise _PfStop()
        else:
            if not q:
                raise EOFError('EOF when reading a line')
            v = q.pop(0)
        out.write(v + '\n')
        return v
    n = [0]
    def lt(f, ev, a):
        n[0] += 1
        if n[0] > 2000000:
            raise _PfLoop()
        return lt
    def gt(f, ev, a):
        return lt if f.f_code.co_filename == '<oefening>' else None
    g = {'__name__': '__main__', 'input': _input}
    so, se = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = out
    err = None
    try:
        c = compile(code, '<oefening>', 'exec')
        sys.settrace(gt)
        try:
            exec(c, g)
        finally:
            sys.settrace(None)
    except SyntaxError as e:
        err = {'t': type(e).__name__, 'm': e.msg, 'l': e.lineno}
    except _PfLoop:
        err = {'t': 'Loop', 'm': '', 'l': None}
    except _PfStop:
        err = {'t': 'Stop', 'm': '', 'l': None}
    except SystemExit:
        pass
    except BaseException as e:
        l = None
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == '<oefening>':
                l = tb.tb_lineno
            tb = tb.tb_next
        err = {'t': type(e).__name__, 'm': str(e), 'l': l}
    finally:
        sys.stdout, sys.stderr = so, se
    return json.dumps({'o': out.getvalue(), 'e': err})
</script>
